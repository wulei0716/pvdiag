[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdiag"
version = "0.1.0"
description = "组串发电量异常诊断智能体系统：同机互比 → 规则/AI 判定 → 人工复核 → 工单闭环 → 自学习"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "pydantic>=2.0",
    "pyyaml>=6",
    "requests>=2.28",
    "joblib>=1.3",
]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.22", "jinja2>=3.1", "python-multipart>=0.0.6"]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
pvdiag = "pvdiag.cli:main"

[tool.setuptools.packages.find]
include = ["pvdiag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
