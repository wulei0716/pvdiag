# pvdiag 配置示例 —— 复制为 config.yaml 后按站点实际调整
# 所有口径均来自《组串发电量异常诊断系统 · 开发流程表》；阈值为起步值，上线后按复核确认率调优

data_dir: ./data
timezone: Asia/Shanghai

runtime:                     # 运行规模（v0.4）
  workers: 1                 # 按站并行进程数：1 串行；N>1 或 0（=CPU 核数）多站并行算基线/诊断，主进程统一落库；环境变量 PVDIAG_WORKERS 可覆盖
  parallel_min_stations: 2

irradiance:                  # 辐照源（v0.4）：竖向基线 Y=E/H、站级 PR、站间互比用。按 providers 顺序回退，每天的来源记在 station_daily.irradiance_source
  source: auto               # auto | none
  providers: [measured, nasa_power, meteonorm, openmeteo, clearsky]
  nasa_power: false          # NASA POWER 日 ALLSKY_SFC_SW_DWN（免费无 key，滞后数天）— 打开即可用，需 stations.lat/lon
  meteonorm: false           # Meteonorm REST（Bearer token，环境变量 METEONORM_TOKEN；导出的小时 CSV 放 <root>/<station>/irradiance/ 也认）
  openmeteo: false           # Open-Meteo ERA5 再分析（免费无 key）
  cache_days: 400            # 外部日值按站缓存在 platform_state，一天只拉一次

thresholds:
  normal_floor: -0.03        # > -3% 正常（正常串自然波动 ±1~2%）
  fault_floor: -0.05         # ≤ -5% 持续低发候选（≈ 噪声带 2~3 倍）
  fault_persist_days: 2      # 连续 ≥2 个晴好天才判 B（单日不算数：云影/采样抖动）
  observe_persist_days: 3    # -5%~-3% 连续 3 天 → D
  zero_current_a: 0.5        # <0.5A 按未接/夜间剔除
  zero_days: 2               # 全天 0 电流连续天数 → A
  voltage_offset: 0.08       # 中午电压偏离同机中位 >8% → 电压异位（串长/MPPT 配置）
  rainy_streak_caution_days: 7   # 连续阴雨后首个晴天 → 低置信
  stale_run_min: 90          # 日间连续 ≥90 分钟电流一动不动 → 半天钉死（数据问题），该日不参与互比
  # 群组噪声门控（来自 Kaggle 两站真实数据：大电站"晴好天"各机互比偏差的稳健标准差可达 2%~7%）
  noise_k: 2.5               # 偏差还要 ≤ -k×群组稳健标准差 才算显著低发
  noise_skip: 0.04           # 群组稳健标准差 >4% 的"晴好天"按云影日处理：不计入也不打断持续度
  cold_start_cap_grade: D    # 冷启动（晴好天基线样本不足）只凭互比偏差最高给 D
  outage_min_slots: 2        # 白天 ≥1h 整段 0 输出而同机其它串正常 → 间歇停机/掉线
  outage_rel_zero: 0.10      # ≤ 群组同时段 10% 视为"整段为 0"
  tracker_side_ratio: 0.85   # 跟踪电站（stations.extra.mount=tracker|tracker_dual）：清晨/傍晚相对群组都 ≤0.85 → 卡滞候选；双轴/中午也偏低时再做物理曲线校核
  bifacial_gain: 1.08        # 双面组件（strings.module_type=bifacial）与单面同机混装时的背面增益归一（按场地反射率调）

baseline:
  tz_meridian_deg: 120       # 时区中央经线（北京时间 120°E）：中午窗口按 stations.lon 平移到太阳时
  noon_start: "11:30"
  noon_end: "13:30"
  rolling_clear_days: 30
  min_clear_days: 5          # 冬季连续阴雨凑不够样本 → 降级为仅同日互比
  clear_day_ratio: 0.35      # 全站中午功率 ≥ 晴天峰值 35%
  clear_cv_max: 0.15
  min_group_size: 3          # 互比群组 <3 串 → 回退整机互比

confidence:
  high: 0.85                 # ≥ 直接派单（draft 模式下为草稿）
  mid: 0.50                  # ≥ 转人工复核，否则仅观察
  min_labels_for_ml: 60      # 标注不足用规则代理模型
  retrain_every_days: 30
  # 模型生命周期：自训练 → 时间留出集考试 → 达标上线 → 线上监督 → 不达标回退
  retrain_min_new_labels: 20 # 新增标注 ≥20 条即触发重训
  holdout_fraction: 0.25     # 按时间留出最近 25%（≥10 条）考试
  promote_tolerance: 0.02    # 挑战者准确率 ≥ 现役 − 2% 且 ≥ 规则代理 − 2% 才上线
  demote_margin: 0.10        # 线上一致率比规则代理低 ≥10 个百分点 → 自动降级回规则代理
  demote_min_samples: 20

dispatch:
  mode: gated                # draft: 永远草稿；auto: 门控通过即自动；gated: 连续达标自动放开、恶化自动收回（默认）
  channel: dryrun            # dryrun（写 outbox/*.md）| wecom（企业微信群机器人）
  wecom_webhook: null        # https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx
  auto_gate_fa_rate_max: 0.10
  auto_gate_min_reviews: 30
  gate_open_streak_days: 7   # gated：门控连续 7 个运行日通过才放开自动派单
  gate_close_field_missed: 3 # gated：窗口内现场漏报 ≥3 起立即收回
  gate_close_on_pipeline_fail: true   # 当天智能体失败 / 数据时延 >2 天 → 收回
  recheck_clear_days: 3      # 处理后 N 个晴好天复查归零
  site_visit_cost_yuan: 300
  merge_same_roof: true      # 同屋面多串合并区域工单

autotune:                    # 阈值自调参闭环（复核结果当考题，影子回放，安全区间内一步，留痕可回滚）
  enabled: true
  mode: apply                # apply: 考试达标自动生效（写运行时覆盖层，本文件不动）；shadow: 只评估只建议
  min_labels: 20             # 窗口内"纯偏差型"复核样本 ≥20 条才动
  window_days: 60
  cooldown_days: 7
  min_f1_gain: 0.05
  min_recall_keep: 0.80
  fault_floor_bounds: [-0.08, -0.04]
  persist_bounds: [2, 4]
  noise_k_bounds: [2.0, 4.0]
  rollback_confirm_drop: 0.10   # 生效后 B 级确认率下跌 ≥10 个百分点 → 自动回滚
  loosen_on_field_missed: 3     # 现场漏报 ≥3 起 → 提议放松（只提议，不自动生效）

ingest:                      # 数据接入自愈
  heal_lookback_days: 14     # 回看 14 天补缺口
  max_heal_days_per_run: 7
  retries: 3
  backoff_seconds: 5         # 5 → 10 → 20 秒
  escalate_after_failures: 3 # 连续失败 ≥3 次升级 error 并推送
  stale_data_alert_days: 2

llm:                         # LLM 分析助手（可选）：复核页"分析助手"面板 + 追问；无 key 时自动用模板文案
  enabled: true              # 私有化/内网部署可设 false 彻底关闭出站
  model: claude-sonnet-4-5
  api_key_env: ANTHROPIC_API_KEY   # 从环境变量读 key，不落配置文件
  base_url: https://api.anthropic.com
  max_tokens: 700

alerts:                      # 关键事件推送（管道 error / 自检 fail / 门控开合 / 模型上线降级 / 参数生效回滚）
  enabled: true
  wecom_webhook: null        # 为空沿用 dispatch.wecom_webhook；都为空写 data/outbox/alerts/<date>.md
  min_level: error
  dedupe_hours: 24

loss:
  default_price_yuan_per_kwh: 0.60
  tou:                       # 峰谷平时段（小时，含起不含止）
    peak: [[10, 12], [14, 17]]
    flat: [[7, 10], [12, 14], [17, 19]]
    valley: [[0, 7], [19, 24]]
  tou_price: { peak: 0.90, flat: 0.60, valley: 0.30 }
  expected_fault_days_default: 30
  cleaning_cost_per_kwp: 15        # 全站清洗单价（元/kWp），站级积灰回本估算用
  repair_cost_by_cause:
    断线/未接: 300
    旁路二极管: 500
    遮挡: 400
    组件衰减/积灰: 200
    MPPT异常: 1500
    数据问题: 50
    间歇停机/掉线: 200
    跟踪支架卡滞: 400

platforms:
  huawei: { base_quota: 24, devices_per_unit: 100, batch_days: 4, token_ttl_minutes: 30 }
  ginlong_pac_unit_divisor: 1000     # 锦浪 pac 单位 W → kW
  sungrow_token_ttl_hours: 48
  sungrow_same_day_available: false  # 阳光不返回当天数据 → 每日拉 T-1

# 电站级平台凭证放在 stations 表的 extra_json.platform_config 中（建议由 DPAPI/EFS/钥匙串解密后注入，不落明文）：
#   huawei:  { user_name, system_code, station_code, base_url }
#   ginlong: { key_id, key_secret, plant_id }
#   sungrow: { appkey, access_key, user_account, user_password, ps_id, points_map: { pac: "p24", strings: { 1: {i: "p5", u: "p6"} } } }
#   csv:     { root: ./import }     # 对接 F:\Hermes 已有拉数脚本的落地文件
#   任意平台可加 fallback_csv_root: ./import —— 云平台连续拉取失败时自动降级读本地落地文件（自愈）
